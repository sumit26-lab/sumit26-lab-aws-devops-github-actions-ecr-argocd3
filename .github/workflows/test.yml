name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Show GitHub Context
        run: |
          echo "========================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workflow Ref: $GITHUB_WORKFLOW_REF"
          echo "========================================"

      - name: Get and Inspect GitHub OIDC Claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not return an OIDC token"
            exit 1
          fi

          echo "GitHub OIDC token obtained successfully."
          echo ""
          echo "OIDC claims:"
          
          printf '%s' "$TOKEN" | python3 -c '
          import sys
          import json
          import base64

          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          data = json.loads(base64.urlsafe_b64decode(payload))

          claims = {
              "iss": data.get("iss"),
              "aud": data.get("aud"),
              "sub": data.get("sub"),
              "repository": data.get("repository"),
              "repository_owner": data.get("repository_owner"),
              "repository_id": data.get("repository_id"),
              "repository_owner_id": data.get("repository_owner_id"),
              "ref": data.get("ref"),
              "ref_type": data.get("ref_type"),
              "event_name": data.get("event_name")
          }

          print(json.dumps(claims, indent=2))
          '

      # AWS authentication temporarily removed.
      # We first need to see the actual OIDC "sub" claim.